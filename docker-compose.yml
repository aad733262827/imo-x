version: "3.8"
services:
  imo-x:
    build: .
    image: imo-x:latest
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Put your keys in a local .env file and do NOT commit it to git
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped
    volumes:
      - ./tmp:/app/tmp
