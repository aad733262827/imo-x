<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>اختبر IMMO X — تحليل إعلان</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:16px}
    label{display:block;margin-top:12px}
    input,select,textarea{width:100%;padding:8px;margin-top:6px}
    button{margin-top:12px;padding:10px 14px}
    .row{display:flex;gap:8px}
    .note{color:#666;margin-top:8px}
    pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:6px}
    .frames{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .frames img{width:120px;height:auto;border:1px solid #ddd}
  </style>
</head>
<body>
  <h2>اختبر تحليل إعلان — IMMO X</h2>
  <p class="note">يمكنك رفع ملف فيديو أو صور (6-12 لقطة) أو وضع رابط فيديو (YouTube/Instagram) إذا كنت تملك yt-dlp.</p>

  <label>رابط الفيديو (اختياري)
    <input id="url" placeholder="https://..." />
  </label>

  <label>أو ارفع ملفات (صور أو فيديو)
    <input id="files" type="file" multiple />
  </label>

  <label>ملاحظات/برومبت إضافي (اختياري)
    <textarea id="prompt" rows="3" placeholder="مثلاً: ركّز على المشاعر، إبراز شعار بالختام"></textarea>
  </label>

  <div class="row">
    <button id="analyze">ابدأ التحليل</button>
    <button id="demo">وضع تجريبي (Demo)</button>
  </div>

  <div id="status" class="note"></div>

  <h3>النتيجة (JSON)</h3>
  <pre id="result">-</pre>

  <h3>النتيجة (Markdown)</h3>
  <pre id="md">-</pre>

  <h3>الإطارات (Frames)</h3>
  <div id="frames" class="frames"></div>

  <script src="/test.js"></script>
</body>
</html>
